name: PR Verification & Security Gates

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - "scripts/**"
      - ".github/workflows/pr.yml"

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  code-lint-and-test:
    name: Go Lint, Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.6"
          cache-dependency-path: app/go.sum

      - name: Verify dependencies
        working-directory: app
        run: |
          go mod verify

      - name: Run Go Format & Vet Check
        working-directory: app
        run: |
          diff -u <(echo -n) <(gofmt -d .)
          go vet ./...

      - name: Run Unit Tests with Coverage
        working-directory: app
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Archive Code Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: app/coverage.out
          retention-days: 7

  static-analysis:
    name: Hadolint & ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Lint Shell Scripts with ShellCheck
        run: |
          find scripts -type f -name "*.sh" -print0 | xargs -0 shellcheck --severity=warning

  vulnerability-scan:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [code-lint-and-test, static-analysis]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build local container image
        run: |
          docker build -t devops-assessment-service:pr-check-${{ github.sha }} .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: devops-assessment-service:pr-check-${{ github.sha }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"
