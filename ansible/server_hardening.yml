---
# ==============================================================================
# Bonus: Ansible Playbook for Ubuntu Server Hardening & Health Script Deployment
# ==============================================================================
- name: Production Host Hardening and Health Monitor Setup
  hosts: all
  become: true
  vars:
    app_dir: /opt/devops-assessment
    health_cron_user: root

  tasks:
    - name: Ensure security and audit packages are present
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
          - curl
          - jq
        state: present
        update_cache: true

    - name: Configure UFW default firewall policies
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }

    - name: Allow SSH with rate limiting
      community.general.ufw:
        rule: limit
        port: "22"
        proto: tcp

    - name: Allow application traffic on Port 8080
      community.general.ufw:
        rule: allow
        port: "8080"
        proto: tcp

    - name: Enable UFW firewall
      community.general.ufw:
        state: enabled

    - name: Create destination directory for scripts
      ansible.builtin.file:
        path: "{{ app_dir }}/scripts"
        state: directory
        mode: "0755"

    - name: Deploy system health audit script
      ansible.builtin.copy:
        src: ../scripts/system_health.sh
        dest: "{{ app_dir }}/scripts/system_health.sh"
        mode: "0755"

    - name: Deploy systemd service unit
      ansible.builtin.copy:
        src: ../scripts/system_health.service
        dest: /etc/systemd/system/system_health.service
        mode: "0644"

    - name: Deploy systemd timer unit
      ansible.builtin.copy:
        src: ../scripts/system_health.timer
        dest: /etc/systemd/system/system_health.timer
        mode: "0644"

    - name: Enable and start systemd health monitor timer
      ansible.builtin.systemd:
        name: system_health.timer
        enabled: true
        state: started
        daemon_reload: true
