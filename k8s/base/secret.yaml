# ==============================================================================
# Sensitive Application Secrets Template
#
# Production Note:
# In accordance with DevSecOps best practices, plain text secrets are never committed.
# In production, this resource is generated dynamically via External Secrets Operator
# (syncing from AWS Secrets Manager or HashiCorp Vault) or decrypted at deploy time
# via Mozilla SOPS / Bitnami Sealed Secrets.
#
# For local / test deployment, populate values via:
#   kubectl create secret generic app-secret \
#     --from-literal=DATABASE_URL="postgres://..." \
#     --from-literal=API_SECRET_KEY="replace-with-secure-key" \
#     --dry-run=client -o yaml | kubectl apply -f -
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  labels:
    app.kubernetes.io/name: devops-assessment-app
type: Opaque
stringData:
  API_SECRET_KEY: "change-me-in-production-via-vault-or-secrets-manager"
  DATABASE_PASSWORD: "change-me-in-production-via-vault-or-secrets-manager"
