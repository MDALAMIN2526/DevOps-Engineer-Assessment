apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

patches:
  - target:
      kind: ConfigMap
      name: app-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: "staging"
  - target:
      kind: Deployment
      name: devops-assessment-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
